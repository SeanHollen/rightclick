<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; margin: 12px; }
    label { display: block; margin-bottom: 12px; }
    textarea { width: 100%; min-height: 6em; font-family: monospace; box-sizing: border-box; }
    small { color: GrayText; }
  </style>
</head>
<body>
  <label><input type="checkbox" id="foreground"> Switch to the new tab (default: open in background)</label>
  <label>
    Disabled on these sites, one per line (subdomains included):
    <textarea id="excludedSites" placeholder="docs.google.com&#10;example.org"></textarea>
  </label>
  <small>Shift+right-click or the keyboard menu key always shows the normal context menu.</small>
  <script src="platform.js"></script>
  <script src="options.js"></script>
</body>
</html>
