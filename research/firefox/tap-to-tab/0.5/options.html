<!doctype html>
<html>
<meta charset="UTF-8">
<link rel=stylesheet href="options.css">
<form>
<fieldset>
  <legend i18n="open_focus"></legend>
  <label i18n="open_tab_front"><input type=radio name=where></label><br>
  <label i18n="open_tab_background"><input type=radio name=where checked></label>
</fieldset>

<fieldset>
  <legend i18n="open_where"></legend>
  <label i18n="open_tab_next"><input type=radio name=nextto></label><br>
  <label i18n="open_tab_end"><input type=radio name=nextto checked></label>
</fieldset>

<fieldset>
  <legend i18n="open_discard"></legend>
  <label i18n="open_tab_notdiscard"><input type=radio name=discard checked></label><br>
  <label i18n="open_tab_discard"><input type=radio name=discard></label>
</fieldset>

<fieldset>
  <legend i18n="blacklist"></legend>
  <textarea autocorrect=off autocapitalize=off spellcheck=false placeholder="example.com
mail.example.com"></textarea>
</fieldset>

<div><a href="https://discourse.mozilla.org/t/support-tap-to-tab-open-links-in-new-tab-with-a-double-click/57486" target="_blank" rel=noreferrer></a></div>
</form>

</html>
